<script>
// Drag-to-scroll for filter-chip rows (.chip-scroll). No visible scrollbar.
(function(){
  var active=null,startX=0,startLeft=0,moved=false;
  document.addEventListener("pointerdown",function(e){
    var el=e.target.closest && e.target.closest(".chip-scroll");
    if(!el || el.scrollWidth<=el.clientWidth) return;
    active=el; startX=e.clientX; startLeft=el.scrollLeft; moved=false;
    el.classList.add("dragging");
  });
  document.addEventListener("pointermove",function(e){
    if(!active) return;
    var dx=e.clientX-startX;
    if(Math.abs(dx)>3) moved=true;
    if(moved){ active.scrollLeft=startLeft-dx; e.preventDefault(); }
  });
  document.addEventListener("pointerup",function(){
    if(!active) return;
    var el=active; active=null; el.classList.remove("dragging");
    if(moved){
      // Swallow the click that follows a real drag (so chip × isn't triggered).
      var cancel=function(ev){ ev.stopPropagation(); ev.preventDefault(); };
      document.addEventListener("click",cancel,true);
      setTimeout(function(){ document.removeEventListener("click",cancel,true); },0);
    }
  });
})();

  var style = document.createElement("style");

  function isClickCatcher(el, cs){
